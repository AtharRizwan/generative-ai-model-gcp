<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanvasCraft</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <style>
    /* Body styling */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f8ff; /* Light blue background */
    }

    /* h1 styling (Bowlby One font, larger font size) */
    h1 {
      font-family: "Bowlby One", sans-serif;
      font-weight: 400;
      font-size: 48px;
      color: #003366; /* Dark Navy */
      margin-bottom: 10px;
    }

    /* h2 styling (Shadows Into Light font, smaller and centered) */
    h3 {
      font-family: "Shadows Into Light", cursive;
      font-weight: 400;
      font-size: 24px;
      color: #005b96; /* Light Navy Blue */
      margin-top: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Input container styling */
    .input-container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    /* Input field styling */
    input[type="text"] {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #005b96;
      border-radius: 5px;
      margin-bottom: 20px;
      background-color: #dfecf9; /* Light blue input field */
    }

    /* Button styling */
  button {
  padding: 10px 20px;
  font-size: 16px;
  background-color: #003366; /* Dark Navy */
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.2s; /* Smooth transition */
}

button:hover {
  background-color: #005b96; /* Light Navy on hover */
}

button:active {
  background-color: #002244; /* Even darker navy when clicked */
  transform: scale(0.95); /* Slightly shrink the button on click */
}

button:disabled {
  opacity: 0.6; /* Dimmed while an image is generating */
  cursor: wait;
}

    /* Image container styling */
    .image-container {
      margin-top: 20px;
      text-align: center;
    }

    /* Image styling */
    img {
      max-width: 100%;
      max-height: 500px;
      border: 1px solid #003366;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>CanvasCraft</h1>
  <h3>The canvas that turns your words into images</h3>
  
  <div class="input-container">
    <input id="text-input" type="text" placeholder="Enter a description..." />
    <button id="generate-button">Generate Image</button>
  </div>

  <div class="image-container" id="image-container">
    <!-- Image will be displayed here -->
     <!-- <img src="https://img.freepik.com/premium-photo/beautiful-glowing-trees-generative-ai-illustration_1023080-5999.jpg?w=2000" alt="Enter text"> -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const generateButton = document.getElementById("generate-button");

    // Function to handle the image generation process
    const generateImage = async () => {
      const textPrompt = document.getElementById("text-input").value.trim();
      const imageContainer = document.getElementById("image-container");

      if (!textPrompt) {
        alert("Please enter a description.");
        return;
      }
      if (generateButton.disabled) {
        return; // A request is already running
      }

      // Clear previous image
      imageContainer.innerHTML = "";

      // Show loading text
      const loadingText = document.createElement("p");
      loadingText.textContent = "Generating image...";
      imageContainer.appendChild(loadingText);
      generateButton.disabled = true;

      try {
        // Same-origin call: Firebase Hosting rewrites /api/** to the Cloud Run proxy
        const response = await axios.post("/api/generate", { prompt: textPrompt });

        // The proxy returns the image as base64
        const image = document.createElement("img");
        image.src = "data:image/png;base64," + response.data.image;
        image.alt = "Generated Image";
        imageContainer.innerHTML = ""; // Clear loading text
        imageContainer.appendChild(image);
      } catch (error) {
        imageContainer.innerHTML = "";
        const errorText = document.createElement("p");
        errorText.textContent = "An error occurred: " + (error.response?.data?.error ?? error.message);
        imageContainer.appendChild(errorText);
      } finally {
        generateButton.disabled = false;
      }
    };
    

    // Listen for button click
    generateButton.addEventListener("click", generateImage);
  
    // Listen for Enter key press to trigger the same function
    document.getElementById("text-input").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        generateImage();
      }
    });

  </script>
  
</body>
</html>
